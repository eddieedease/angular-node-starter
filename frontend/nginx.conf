server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Enable DNS resolution inside Nginx container
    resolver 1.1.1.1 8.8.8.8 valid=30s;

    # Explicitly disable caching for index.html (guarantees fresh SPA entry point)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Proxy API calls directly to the Backend API container / endpoint
    location /api/ {
        proxy_pass https://api.easetest.nl/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.easetest.nl;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aggressive immutable caching for hashed static assets (JS, CSS, images, fonts)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|ico|webp|avif|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA routing fallback for all other routes
    location / {
        try_files $uri $uri/ /index.html;
        # Ensure HTML responses on route changes are never cached
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
